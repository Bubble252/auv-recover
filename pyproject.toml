[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auv-fault"
version = "0.1.0"
description = "Fault injection, supervision, and degradation contracts for AUV operations."
requires-python = ">=3.10"
dependencies = ["auv-core>=0.1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11", "mypy>=1.10,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.10"
files = ["src/auv_fault", "tests"]
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
